<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인세인 광기 카드 공모 — 준비 중</title>
  <style>
    :root {
      --bg: #0f0d0e;
      --paper: #1a1618;
      --ink: #e8e1dc;
      --muted: #9a8f8a;
      --accent: #b3263a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--paper);
      border: 1px solid #3a2f33;
      border-top: 4px solid var(--accent);
      border-radius: 10px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin: 0 0 12px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 16px;
      line-height: 1.4;
    }
    p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }
    footer {
      margin-top: 32px;
      font-size: 11px;
      color: #6d6360;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">COMING SOON</p>
    <h1>인세인 광기 카드 공모</h1>
    <p>광기가 스며드는 중입니다.<br>조금만 기다려 주세요.</p>
    <footer>
      본 사이트는 「河嶋陶一朗」「冒険企画局」「株式会社新紀元社」가 권리를 가진<br>
      『マルチジャンル・ホラーRPG インセイン』의 2차 창작 팬 사이트입니다.
    </footer>
  </main>
</body>
</html>
