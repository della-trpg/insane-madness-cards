  <template id="page-rules">
    <article class="prose">
      <h1>투고 규칙</h1>

      <h2>투고할 수 있는 것</h2>
      <ul>
        <li>본인이 직접 떠올린 <b>창작 광기 카드</b>만 투고할 수 있습니다.</li>
        <li>공식 룰북·서플리먼트에 실린 광기 카드의 문장을 그대로 옮기거나 조금만 바꾼 카드는 투고할 수 없습니다.</li>
        <li>다른 사람의 창작물을 허락 없이 가져오거나 본인 것처럼 투고하지 마세요.</li>
      </ul>

      <h2>투고할 수 없는 것</h2>
      <ul>
        <li>실존 인물·단체를 비방하거나 특정할 수 있는 내용</li>
        <li>혐오·차별 표현, 과도한 성적 묘사, 미성년자를 성적으로 다루는 내용</li>
        <li>광고, 도배, 같은 카드의 반복 투고</li>
      </ul>

      <h2>운영 방식</h2>
      <ul>
        <li>투고한 카드는 관리자 확인 후 게시됩니다. 규칙에 맞지 않으면 반려될 수 있습니다.</li>
        <li>게시 전(확인 대기 중)에는 수정할 수 있고, 삭제는 언제든 할 수 있습니다.</li>
        <li>도배 방지를 위해 24시간 동안 1인당 5장까지 투고할 수 있습니다.</li>
        <li>좋아요는 카드 한 장에 1인당 1번 누를 수 있고, 언제든 취소할 수 있습니다.</li>
      </ul>

      <h2>저작권</h2>
      <ul>
        <li>투고된 카드의 저작권은 투고자에게 있습니다.</li>
        <li>투고자는 이 사이트에 카드를 게시하고, 랭킹 등으로 소개하는 것을 허락한 것으로 봅니다.</li>
        <li>카드를 삭제하면 사이트에서도 사라집니다.</li>
      </ul>

      <h2>'인세인 SCP' 월드세팅 카드</h2>
      <p>『인세인 3: 인세인 SCP』는 SCP 재단 설정을 바탕으로 하며, SCP 재단의 콘텐츠는
        <a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ko" target="_blank" rel="noopener">CC BY-SA 3.0</a>
        라이선스를 따릅니다. 특정 SCP 항목의 내용을 소재로 쓴 카드는 해당 라이선스 조건(출처 표시, 동일 조건 변경 허락)을 따르는 것으로 봅니다.</p>

      <h2>원작 권리 표기</h2>
      <p>본 사이트는 「河嶋陶一朗」「冒険企画局」「株式会社新紀元社」가 권리를 가진

        비공식 2차 창작 팬 사이트이며, 원작 권리자와 관계가 없습니다.</p>
    </article>

  <template id="page-privacy">
    <article class="prose">
      <h1>개인정보처리방침</h1>

      <h2>1. 수집하는 정보</h2>
      <ul>
        <li><b>구글 로그인 시 자동으로 저장되는 정보:</b> 구글 계정 이메일, 구글 계정 이름, 프로필 사진 주소, 로그인 식별자</li>
        <li><b>직접 입력하는 정보:</b> 닉네임, 투고한 카드 내용</li>
        <li><b>이용 기록:</b> 투고·좋아요한 시각</li>
      </ul>

      <h2>2. 이용 목적</h2>
      <ul>
        <li>본인 확인 및 로그인 유지</li>
        <li>좋아요 중복 방지, 투고 도배 방지</li>
        <li>투고 카드의 작성자 표시(닉네임만 표시)</li>
      </ul>
      <p>이메일, 구글 계정 이름, 프로필 사진은 사이트 화면에 표시되지 않으며, 위 목적 외에는 사용하지 않습니다.</p>

      <h2>3. 보관 기간과 삭제</h2>
      <p>정보는 탈퇴할 때까지 보관합니다. <a href="#/my">내 카드</a> 화면의 <b>탈퇴하기</b> 버튼으로 언제든 직접 탈퇴할 수 있으며,
        탈퇴하면 로그인 정보, 닉네임, 좋아요 기록이 즉시 삭제됩니다.
        투고한 카드는 탈퇴할 때 함께 삭제하거나, 작성자 표시 없이 남기도록 선택할 수 있습니다.</p>

        <li><b>GitHub Pages</b>: 사이트 호스팅 (접속 기록이 남을 수 있음)</li>
      </ul>
